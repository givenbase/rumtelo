name: Resolve deploy environment
description: |
    Maps GitHub Environments (staging | production) to which secrets/vars to inject.
    Deployed runs use NODE_ENV=production (Next builds require it; launch deferral
    follows NODE_ENV — Energy/Soul off in production). Local uses development .env.

inputs:
    deploy_environment:
        description: 'Override GitHub environment name (staging | production). Empty = infer from branch.'
        required: false
        default: ''

outputs:
    github_environment:
        description: GitHub Environments name (staging | production)
        value: ${{ steps.resolve.outputs.github_environment }}
    node_env:
        description: Backend NODE_ENV for deployed runs (production)
        value: ${{ steps.resolve.outputs.node_env }}
    is_production:
        description: 'true when GitHub environment is production'
        value: ${{ steps.resolve.outputs.is_production }}

runs:
    using: composite
    steps:
        - id: resolve
          shell: bash
          run: |
              INPUT="${{ inputs.deploy_environment }}"
              REF="${{ github.ref }}"

              if [ -n "$INPUT" ]; then
                GITHUB_ENV="$INPUT"
              elif [ "$REF" = "refs/heads/main" ]; then
                GITHUB_ENV="production"
              else
                GITHUB_ENV="staging"
              fi

              case "$GITHUB_ENV" in
                production)
                  NODE_ENV="production"
                  IS_PROD="true"
                  ;;
                staging)
                  # Next + Nest deploy builds use production; staging vs prod is
                  # which GitHub Environment secrets you inject.
                  NODE_ENV="production"
                  IS_PROD="false"
                  ;;
                *)
                  echo "::error::Unknown GitHub environment '$GITHUB_ENV'. Use only 'staging' or 'production'."
                  exit 1
                  ;;
              esac

              {
                echo "github_environment=$GITHUB_ENV"
                echo "node_env=$NODE_ENV"
                echo "is_production=$IS_PROD"
              } >> "$GITHUB_OUTPUT"

              echo "::group::Resolved deploy environment"
              echo "GitHub environment:  $GITHUB_ENV  (Settings → Environments)"
              echo "Backend NODE_ENV:    $NODE_ENV"
              echo "Branch:              $REF"
              echo "::endgroup::"
