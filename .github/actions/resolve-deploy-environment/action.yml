name: Resolve deploy environment
description: |
    Maps GitHub Environments (staging | production) to application runtime values.
    - GitHub `staging` → deployed staging secrets/vars (backend NODE_ENV stays `production`)
    - GitHub `production` → production secrets/vars
    Local development uses NODE_ENV `development` (.env) — not a GitHub environment.
    Aligns with apps/backend/src/common/config/env.config.ts and apps/*/app/_utils/get-env.ts

inputs:
    deploy_environment:
        description: 'Override GitHub environment name (staging | production). Empty = infer from branch.'
        required: false
        default: ''

outputs:
    github_environment:
        description: GitHub Environments name (staging | production)
        value: ${{ steps.resolve.outputs.github_environment }}
    node_env:
        description: Backend NODE_ENV (production for both deployed envs — Rumtelo has no staging NODE_ENV)
        value: ${{ steps.resolve.outputs.node_env }}
    next_public_app_env:
        description: NEXT_PUBLIC_APP_ENV / APP_ENV (staging | production) — launch product surface
        value: ${{ steps.resolve.outputs.next_public_app_env }}
    is_production:
        description: 'true when GitHub environment is production'
        value: ${{ steps.resolve.outputs.is_production }}

runs:
    using: composite
    steps:
        - id: resolve
          shell: bash
          run: |
              INPUT="${{ inputs.deploy_environment }}"
              REF="${{ github.ref }}"

              if [ -n "$INPUT" ]; then
                GITHUB_ENV="$INPUT"
              elif [ "$REF" = "refs/heads/main" ]; then
                GITHUB_ENV="production"
              else
                GITHUB_ENV="staging"
              fi

              case "$GITHUB_ENV" in
                production)
                  NODE_ENV="production"
                  APP_ENV="production"
                  IS_PROD="true"
                  ;;
                staging)
                  # Backend EnvSchema only allows development | test | production.
                  # Staging vs production is which GitHub Environment secrets you inject.
                  NODE_ENV="production"
                  APP_ENV="staging"
                  IS_PROD="false"
                  ;;
                *)
                  echo "::error::Unknown GitHub environment '$GITHUB_ENV'. Use only 'staging' or 'production'."
                  exit 1
                  ;;
              esac

              {
                echo "github_environment=$GITHUB_ENV"
                echo "node_env=$NODE_ENV"
                echo "next_public_app_env=$APP_ENV"
                echo "is_production=$IS_PROD"
              } >> "$GITHUB_OUTPUT"

              echo "::group::Resolved deploy environment"
              echo "GitHub environment:  $GITHUB_ENV  (Settings → Environments)"
              echo "Backend NODE_ENV:    $NODE_ENV"
              echo "App env label:       $APP_ENV"
              echo "Branch:              $REF"
              echo "::endgroup::"
