<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 760" width="770" height="760" font-family="Archivo, Helvetica, Arial, sans-serif">
  <title>Mockup — Close month sheet from the Home next move: prior month first, then bills (375 px)</title>
  <!-- Proposal only. One flow, two doors (next-move card, month score). Brand tokens. -->
  <!-- Panel 1: chain step -->
  <g>
    <rect width="375" height="760" fill="#EEF1F5"/>
    <rect width="375" height="760" fill="#1A202D" fill-opacity="0.45"/>
    <rect x="0" y="380" width="375" height="380" rx="20" fill="#FFFFFF"/>
    <rect x="167" y="390" width="40" height="4" rx="2" fill="#D5DBE3"/>
    <text x="20" y="432" font-size="18" font-weight="700" fill="#1A202D">Close November</text>
    <circle cx="341" cy="426" r="22" fill="#EEF1F5"/><text x="341" y="431" font-size="14" fill="#1A202D" text-anchor="middle">×</text>
    <text x="20" y="476" font-size="15" fill="#1A202D">Close October first — months close in order.</text>
    <rect x="20" y="500" width="335" height="48" rx="10" fill="#06656C"/>
    <text x="187" y="529" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Close October</text>
    <text x="187" y="586" font-size="14" font-weight="600" fill="#06656C" text-anchor="middle">Not now</text>
    <text x="20" y="650" font-size="11" fill="#5B6472">Home's period does not change. "Close October" re-targets</text>
    <text x="20" y="666" font-size="11" fill="#5B6472">the sheet; after it closes, the sheet moves on to November.</text>
  </g>
  <!-- Panel 2: bills step -->
  <g transform="translate(395 0)">
    <rect width="375" height="760" fill="#EEF1F5"/>
    <rect width="375" height="760" fill="#1A202D" fill-opacity="0.45"/>
    <rect x="0" y="120" width="375" height="640" rx="20" fill="#FFFFFF"/>
    <rect x="167" y="130" width="40" height="4" rx="2" fill="#D5DBE3"/>
    <text x="20" y="172" font-size="18" font-weight="700" fill="#1A202D">Close October</text>
    <circle cx="341" cy="166" r="22" fill="#EEF1F5"/><text x="341" y="171" font-size="14" fill="#1A202D" text-anchor="middle">×</text>
    <text x="20" y="204" font-size="13" fill="#5B6472">Unpaid bills this month. Carry each one forward or</text>
    <text x="20" y="222" font-size="13" fill="#5B6472">skip it, then close.</text>
    <rect x="16" y="240" width="343" height="120" rx="12" fill="#F6F8FA" stroke="#D5DBE3"/>
    <text x="32" y="266" font-size="14" font-weight="600" fill="#1A202D">[bill name]</text>
    <text x="343" y="266" font-size="12" fill="#5B6472" text-anchor="end">[amount]</text>
    <text x="32" y="288" font-size="12" fill="#5B6472">Next month you'll owe [2× amount] (2× this bill).</text>
    <rect x="32" y="302" width="150" height="44" rx="10" fill="#DDEFEF" stroke="#06656C"/>
    <text x="107" y="329" font-size="13" font-weight="600" fill="#06656C" text-anchor="middle">Carry forward</text>
    <rect x="192" y="302" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#D5DBE3"/>
    <text x="267" y="329" font-size="13" fill="#5B6472" text-anchor="middle">Skip</text>
    <text x="20" y="400" font-size="13" fill="#5B6472">A closed month can't be changed.</text>
    <rect x="20" y="420" width="335" height="48" rx="10" fill="#06656C"/>
    <text x="187" y="449" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Close October</text>
    <text x="187" y="506" font-size="14" font-weight="600" fill="#06656C" text-anchor="middle">Not now</text>
    <text x="20" y="560" font-size="11" fill="#5B6472">Choice chips grow to 44 px (today 10 px mono, ~24 px tall).</text>
    <text x="20" y="576" font-size="11" fill="#5B6472">Bracketed text = data slots, not copy.</text>
  </g>
</svg>
