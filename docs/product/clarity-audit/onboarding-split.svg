<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 720" width="375" height="720" font-family="Archivo, Helvetica, Arial, sans-serif">
  <title>Mockup — Onboarding: split your first income (375 px)</title>
  <!-- Proposal only. Brand tokens: surface #EEF1F5, raised #FFFFFF, fg #1A202D, accent #06656C, accent-soft #DDEFEF, line #D5DBE3 -->
  <rect width="375" height="720" fill="#EEF1F5"/>
  <text x="16" y="40" font-size="11" fill="#5B6472">Step 2 of 2</text>
  <circle cx="340" cy="36" r="4" fill="#06656C"/><circle cx="354" cy="36" r="4" fill="#06656C"/>
  <text x="16" y="84" font-size="24" font-weight="700" fill="#1A202D">Here's where your</text>
  <text x="16" y="112" font-size="24" font-weight="700" fill="#1A202D">€2,850 goes.</text>
  <text x="16" y="138" font-size="13" fill="#5B6472">Each jar has one job. Change the percentages any time —</text>
  <text x="16" y="156" font-size="13" fill="#5B6472">the habit matters more than the numbers.</text>
  <rect x="16" y="174" width="343" height="282" rx="14" fill="#FFFFFF" stroke="#D5DBE3"/>
  <g font-size="13" fill="#1A202D">
    <text x="32" y="208" font-weight="600">Necessities</text><text x="250" y="208" fill="#5B6472" text-anchor="end">55%</text><text x="343" y="208" text-anchor="end" font-weight="600">€1,567.50</text>
    <text x="32" y="225" font-size="11" fill="#5B6472">rent, bills, groceries</text>
    <line x1="32" y1="238" x2="343" y2="238" stroke="#EEF1F5"/>
    <text x="32" y="260" font-weight="600">Financial Freedom</text><text x="250" y="260" fill="#5B6472" text-anchor="end">10%</text><text x="343" y="260" text-anchor="end" font-weight="600">€285.00</text>
    <text x="32" y="277" font-size="11" fill="#5B6472">invested, never spent</text>
    <line x1="32" y1="290" x2="343" y2="290" stroke="#EEF1F5"/>
    <text x="32" y="312" font-weight="600">Education</text><text x="250" y="312" fill="#5B6472" text-anchor="end">10%</text><text x="343" y="312" text-anchor="end" font-weight="600">€285.00</text>
    <text x="32" y="338" font-weight="600">Long Term Savings</text><text x="250" y="338" fill="#5B6472" text-anchor="end">10%</text><text x="343" y="338" text-anchor="end" font-weight="600">€285.00</text>
    <text x="32" y="364" font-weight="600">Play</text><text x="250" y="364" fill="#5B6472" text-anchor="end">10%</text><text x="343" y="364" text-anchor="end" font-weight="600">€285.00</text>
    <text x="32" y="390" font-weight="600">Give</text><text x="250" y="390" fill="#5B6472" text-anchor="end">5%</text><text x="343" y="390" text-anchor="end" font-weight="600">€142.50</text>
  </g>
  <rect x="32" y="410" width="311" height="10" rx="5" fill="#D5DBE3"/>
  <rect x="32" y="410" width="171" height="10" rx="5" fill="#06656C"/>
  <rect x="205" y="410" width="30" height="10" fill="#2EAEAA"/><rect x="237" y="410" width="30" height="10" fill="#4ED9D2"/>
  <rect x="269" y="410" width="30" height="10" fill="#00777F"/><rect x="301" y="410" width="28" height="10" fill="#9ADBD6"/><rect x="331" y="410" width="12" height="10" rx="3" fill="#1A202D"/>
  <text x="32" y="442" font-size="11" fill="#5B6472">Amounts from the server split (remainder to the largest jar).</text>
  <rect x="16" y="472" width="343" height="62" rx="12" fill="#DDEFEF"/>
  <text x="32" y="498" font-size="12" fill="#1A202D">Rumtelo never moves money. Savings pots at your</text>
  <text x="32" y="516" font-size="12" fill="#1A202D">bank? Move it there yourself — we show the split.</text>
  <rect x="16" y="558" width="343" height="48" rx="12" fill="#06656C"/>
  <text x="187" y="588" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Looks right — open my board  →</text>
  <text x="187" y="630" font-size="12" fill="#5B6472" text-anchor="middle">Back</text>
  <text x="16" y="680" font-size="10" fill="#8A93A0">Moved out of onboarding: "Your dream" (→ Course / Plan your year), bank names, IBAN and</text>
  <text x="16" y="694" font-size="10" fill="#8A93A0">jar-to-account map (→ optional week-1 checklist; default: all jars on one main account).</text>
</svg>
