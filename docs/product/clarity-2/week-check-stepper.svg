<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 760" width="375" height="760" font-family="Archivo, Helvetica, Arial, sans-serif">
  <title>Mockup — folded week check, Course stage 4 of 6 (375 px)</title>
  <!-- Proposal only. Brand tokens: surface #EEF1F5, raised #FFFFFF, fg #1A202D, fg-muted #5B6472, accent #06656C, accent-soft #DDEFEF, line #D5DBE3 -->
  <rect width="375" height="760" fill="#EEF1F5"/>
  <rect width="375" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="375" y2="56" stroke="#D5DBE3"/>
  <text x="16" y="35" font-size="17" font-weight="700" fill="#06656C">R</text><text x="29" y="35" font-size="15" fill="#1A202D">umtelo</text>
  <rect x="214" y="16" width="70" height="26" rx="13" fill="#EEF1F5"/><text x="249" y="33" font-size="11" fill="#5B6472" text-anchor="middle">Nov ▾</text>
  <circle cx="310" cy="29" r="15" fill="none" stroke="#D5DBE3"/><text x="310" y="33" font-size="12" fill="#5B6472" text-anchor="middle">?</text>
  <circle cx="345" cy="29" r="16" fill="#06656C"/><text x="345" y="33" font-size="10" fill="#FFFFFF" text-anchor="middle">GL</text>
  <!-- header -->
  <text x="16" y="88" font-size="10" letter-spacing="1.2" fill="#5B6472">TEN MINUTES A WEEK</text>
  <text x="16" y="116" font-size="24" font-weight="700" fill="#1A202D">Week check</text>
  <text x="16" y="138" font-size="12" fill="#5B6472">Week 46 · 10–16 Nov</text>
  <!-- stepper -->
  <rect x="16" y="152" width="343" height="86" rx="14" fill="#FFFFFF" stroke="#D5DBE3"/>
  <text x="32" y="176" font-size="12" font-weight="600" fill="#1A202D">Step 4 of 6 · about ten minutes</text>
  <text x="32" y="198" font-size="9" letter-spacing="1" fill="#5B6472">MONEY · WK 46</text>
  <text x="196" y="198" font-size="9" letter-spacing="1" fill="#5B6472">COURSE · WK 47</text>
  <g>
    <rect x="32" y="206" width="46" height="6" rx="3" fill="#06656C"/>
    <rect x="82" y="206" width="46" height="6" rx="3" fill="#06656C"/>
    <rect x="132" y="206" width="46" height="6" rx="3" fill="#06656C"/>
    <rect x="196" y="206" width="46" height="6" rx="3" fill="#06656C" stroke="#06656C" stroke-opacity="0.3" stroke-width="4"/>
    <rect x="246" y="206" width="46" height="6" rx="3" fill="#D5DBE3"/>
    <rect x="296" y="206" width="46" height="6" rx="3" fill="#D5DBE3"/>
  </g>
  <text x="32" y="230" font-size="11" fill="#06656C">Course · last week's three</text>
  <!-- stage card -->
  <rect x="16" y="252" width="343" height="320" rx="16" fill="#FFFFFF" stroke="#D5DBE3"/>
  <text x="32" y="284" font-size="17" font-weight="700" fill="#1A202D">How did week 46 go?</text>
  <text x="32" y="304" font-size="12" fill="#5B6472">Mark each one. Not done is a fact: move it on</text>
  <text x="32" y="320" font-size="12" fill="#5B6472">or let it go.</text>
  <text x="32" y="346" font-size="11" fill="#5B6472">Your intention: (saved from Intend)</text>
  <g font-size="13" fill="#1A202D">
    <rect x="32" y="360" width="311" height="56" rx="12" fill="#EEF1F5"/>
    <circle cx="56" cy="388" r="10" fill="#06656C"/><text x="56" y="392" font-size="11" fill="#FFFFFF" text-anchor="middle">✓</text>
    <rect x="76" y="380" width="150" height="8" rx="4" fill="#D5DBE3"/><rect x="76" y="394" width="90" height="6" rx="3" fill="#D5DBE3"/>
    <rect x="32" y="424" width="311" height="56" rx="12" fill="#EEF1F5"/>
    <circle cx="56" cy="452" r="10" fill="none" stroke="#5B6472"/>
    <rect x="76" y="444" width="170" height="8" rx="4" fill="#D5DBE3"/><rect x="76" y="458" width="70" height="6" rx="3" fill="#D5DBE3"/>
    <rect x="32" y="488" width="311" height="56" rx="12" fill="#EEF1F5"/>
    <circle cx="56" cy="516" r="10" fill="none" stroke="#5B6472"/>
    <rect x="76" y="508" width="120" height="8" rx="4" fill="#D5DBE3"/><rect x="76" y="522" width="100" height="6" rx="3" fill="#D5DBE3"/>
  </g>
  <text x="16" y="600" font-size="13" fill="#06656C" text-decoration="underline">Skip Course this week</text>
  <!-- sticky action bar -->
  <rect x="0" y="624" width="375" height="72" fill="#FFFFFF"/><line x1="0" y1="624" x2="375" y2="624" stroke="#D5DBE3"/>
  <rect x="16" y="636" width="110" height="48" rx="24" fill="none" stroke="#B9C2CE"/><text x="71" y="665" font-size="14" font-weight="600" fill="#1A202D" text-anchor="middle">Back</text>
  <rect x="138" y="636" width="221" height="48" rx="24" fill="#06656C"/><text x="248" y="665" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Next  →</text>
  <!-- bottom tabs -->
  <rect x="0" y="696" width="375" height="64" fill="#FFFFFF"/><line x1="0" y1="696" x2="375" y2="696" stroke="#D5DBE3"/>
  <g font-size="11" text-anchor="middle" fill="#5B6472">
    <text x="47" y="740">Home</text>
    <rect x="94" y="696" width="94" height="2" fill="#06656C"/><text x="141" y="740" fill="#06656C">Money</text>
    <text x="235" y="740">Growth</text><text x="328" y="740">More</text>
  </g>
</svg>
