<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 700" width="375" height="700" font-family="Archivo, Helvetica, Arial, sans-serif">
  <title>Mockup — lock page, Debt on Basic, owner (375 px)</title>
  <!-- Proposal only. Price comes from PLAN_RETAIL_CENTS; numbers in the Example are illustrative shapes. -->
  <rect width="375" height="700" fill="#EEF1F5"/>
  <rect x="16" y="40" width="132" height="26" rx="13" fill="#FFFFFF" stroke="#D5DBE3"/>
  <text x="30" y="58" font-size="11" fill="#1A202D">🔒 Locked · in Plus</text>
  <text x="16" y="104" font-size="22" font-weight="700" fill="#1A202D">Debt is in Plus · €9/month</text>
  <text x="16" y="134" font-size="13" fill="#1A202D">See the date you're debt-free and what one</text>
  <text x="16" y="152" font-size="13" fill="#1A202D">extra payment changes.</text>
  <text x="16" y="176" font-size="13" fill="#5B6472">Everything you've entered stays yours on every plan.</text>
  <!-- Example -->
  <rect x="16" y="198" width="343" height="150" rx="16" fill="#FFFFFF" stroke="#D5DBE3" stroke-dasharray="4 3"/>
  <text x="32" y="224" font-size="10" letter-spacing="1.2" fill="#5B6472">EXAMPLE</text>
  <text x="32" y="252" font-size="12" fill="#5B6472">Debt-free</text>
  <text x="343" y="252" font-size="14" font-weight="700" fill="#1A202D" text-anchor="end">Mar 2028</text>
  <rect x="32" y="264" width="311" height="10" rx="5" fill="#D5DBE3"/><rect x="32" y="264" width="200" height="10" rx="5" fill="#06656C"/>
  <text x="32" y="302" font-size="12" fill="#1A202D">+€50 a month</text>
  <text x="343" y="302" font-size="12" font-weight="600" fill="#06656C" text-anchor="end">7 months sooner</text>
  <rect x="32" y="316" width="311" height="10" rx="5" fill="#D5DBE3"/><rect x="32" y="316" width="240" height="10" rx="5" fill="#06656C" fill-opacity="0.55"/>
  <!-- actions -->
  <rect x="16" y="380" width="343" height="48" rx="24" fill="#06656C"/><text x="188" y="409" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Switch to Plus</text>
  <rect x="16" y="440" width="343" height="48" rx="24" fill="none" stroke="#B9C2CE"/><text x="188" y="469" font-size="14" font-weight="600" fill="#1A202D" text-anchor="middle">Not now</text>
  <text x="16" y="530" font-size="11" fill="#5B6472">MEMBER: buttons replaced by "Ask {owner} to switch to Plus." + Not now.</text>
  <text x="16" y="548" font-size="11" fill="#5B6472">VIEWER / Practice preview: today's copy, no price, Back.</text>
</svg>
