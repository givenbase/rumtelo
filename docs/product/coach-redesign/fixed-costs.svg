<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 1318" width="810" height="1318" font-family="Archivo, Helvetica, Arial, sans-serif"><title>Money › Fixed costs before and after, 390 px</title><!-- Proposal only (coach-redesign.md). Brand tokens. Purple dashed frames + numbers mark Coach surfaces in BEFORE. --><g transform="translate(0 0)"><rect width="390" height="1230" fill="#EEF1F5"/><rect x="0" y="0" width="390" height="56" rx="0" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D5DBE3"/><text x="16" y="34" font-size="17" font-weight="700" fill="#06656C" text-anchor="start">rumtelo</text><text x="374" y="34" font-size="12" font-weight="400" fill="#5A6474" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace">Money</text><rect x="4" y="70" width="382" height="48" rx="14" fill="none" stroke="#7A3FA0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="374" cy="72" r="11" fill="#7A3FA0"/><text x="374" y="76" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="16" y="72" width="358" height="44" rx="10" fill="#E8ECF2" stroke="#D5DBE3" stroke-width="1"/><text x="26" y="92" font-size="11" font-weight="700" fill="#06656C" text-anchor="start">✦</text><text x="42" y="92" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Fixed costs are decisions you made once and pay</text><text x="42" y="107" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">for monthly. Review them like decisions.</text><text x="366" y="92" font-size="9" font-weight="400" fill="#06656C" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace">THE COACH</text><rect x="16" y="132" width="358" height="48" rx="24" fill="#06656C"/><text x="195" y="162" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Week check</text><text x="16" y="208" font-size="10" font-weight="600" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ MONEY · FIXED COSTS</text><text x="16" y="240" font-size="26" font-weight="700" fill="#1A202D" text-anchor="start">Fixed costs</text><text x="16" y="266" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start">Every month out: € …</text><rect x="16" y="286" width="110" height="40" rx="20" fill="#06656C"/><text x="71" y="311" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add bill</text><text x="374" y="311" font-size="11" font-weight="400" fill="#047857" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace">Left over + € …</text><rect x="16" y="342" width="358" height="196" rx="16" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/><text x="30" y="370" font-size="10" font-weight="700" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ EVERY MONTH OUT</text><circle cx="38" cy="410" r="14" fill="#E8ECF2"/><text x="62" y="408" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="424" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="414" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="436" x2="360" y2="436" stroke="#D5DBE3"/><circle cx="38" cy="460" r="14" fill="#E8ECF2"/><text x="62" y="458" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="474" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="464" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="486" x2="360" y2="486" stroke="#D5DBE3"/><circle cx="38" cy="510" r="14" fill="#E8ECF2"/><text x="62" y="508" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="524" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="514" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><rect x="4" y="552" width="382" height="158" rx="14" fill="none" stroke="#7A3FA0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="374" cy="554" r="11" fill="#7A3FA0"/><text x="374" y="558" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="16" y="554" width="358" height="118" rx="16" fill="#FFFFFF" stroke="#06656C" stroke-width="1"/><text x="30" y="580" font-size="10" font-weight="700" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ SUBSCRIPTION CHECK</text><text x="30" y="602" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Check every quarter that everything here still</text><text x="30" y="620" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">applies. Small amounts add up — a subscription you</text><text x="30" y="638" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">don't use is money you throw away monthly. Healthy:</text><text x="30" y="656" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">less than 20% of Necessity goes to recurring services.</text><rect x="4" y="684" width="382" height="122" rx="14" fill="none" stroke="#7A3FA0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="374" cy="686" r="11" fill="#7A3FA0"/><text x="374" y="690" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="16" y="686" width="358" height="100" rx="16" fill="#FFFFFF" stroke="#06656C" stroke-width="1"/><text x="30" y="712" font-size="10" font-weight="700" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ IS THIS ENOUGH?</text><text x="30" y="734" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Fixed costs take …% — that's above the 55%</text><text x="30" y="752" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Necessities goal. Simplify bills and/or raise</text><text x="30" y="770" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">income — do not raid Financial Freedom.</text><rect x="4" y="798" width="382" height="194" rx="14" fill="none" stroke="#7A3FA0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="374" cy="800" r="11" fill="#7A3FA0"/><text x="374" y="804" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="16" y="800" width="358" height="166" rx="16" fill="#F7EEE6" stroke="#9A4E08" stroke-width="1"/><text x="30" y="826" font-size="10" font-weight="700" fill="#9A4E08" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ NECESSITIES UNDER PRESSURE</text><text x="30" y="848" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Fixed costs take …% of income — above the 55%</text><text x="30" y="866" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Necessities goal. That is common at the start …</text><text x="30" y="884" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Do not raid Financial Freedom to paper over rent.</text><text x="30" y="902" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">Envelope € …/mo · fixed OUT …% of income</text><rect x="30" y="922" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#9AA3B0" stroke-width="1"/><text x="105" y="945" font-size="12" font-weight="600" fill="#1A202D" text-anchor="middle">Open Necessities jar</text><rect x="190" y="922" width="150" height="36" rx="18" fill="#06656C"/><text x="265" y="945" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Raise income</text><rect x="4" y="978" width="382" height="158" rx="14" fill="none" stroke="#7A3FA0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="374" cy="980" r="11" fill="#7A3FA0"/><text x="374" y="984" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="16" y="980" width="358" height="148" rx="16" fill="#F7EEE6" stroke="#9A4E08" stroke-width="1"/><text x="30" y="1006" font-size="10" font-weight="700" fill="#9A4E08" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ BUSINESS COSTS IN YOUR JARS</text><text x="30" y="1028" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">€ … p/m of business costs run through your</text><text x="30" y="1046" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">household. Pay them from the business or raise</text><text x="30" y="1064" font-size="12" font-weight="400" fill="#3E4859" text-anchor="start">your draw — then only the draw stays in the jars.</text><rect x="30" y="1084" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#9AA3B0" stroke-width="1"/><text x="105" y="1107" font-size="12" font-weight="600" fill="#1A202D" text-anchor="middle">Open holding</text><rect x="190" y="1084" width="150" height="36" rx="18" fill="#06656C"/><text x="265" y="1107" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">See linked bills</text></g><text x="195" y="1254" font-size="13" font-weight="700" fill="#1A202D" text-anchor="middle">BEFORE: 5 Coach surfaces, 2 of them always on</text><g transform="translate(420 0)"><rect width="390" height="1230" fill="#EEF1F5"/><rect x="0" y="0" width="390" height="56" rx="0" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D5DBE3"/><text x="16" y="34" font-size="17" font-weight="700" fill="#06656C" text-anchor="start">rumtelo</text><text x="374" y="34" font-size="12" font-weight="400" fill="#5A6474" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace">Money</text><rect x="16" y="72" width="358" height="48" rx="24" fill="#06656C"/><text x="195" y="102" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Week check</text><text x="16" y="148" font-size="10" font-weight="600" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ MONEY · FIXED COSTS</text><text x="16" y="180" font-size="26" font-weight="700" fill="#1A202D" text-anchor="start">Fixed costs</text><text x="16" y="206" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start">Every month out: € …</text><rect x="16" y="226" width="110" height="40" rx="20" fill="#06656C"/><text x="71" y="251" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add bill</text><text x="374" y="251" font-size="11" font-weight="400" fill="#047857" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace">Left over + € …</text><rect x="16" y="282" width="358" height="396" rx="16" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/><text x="30" y="310" font-size="10" font-weight="700" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ EVERY MONTH OUT</text><circle cx="38" cy="350" r="14" fill="#E8ECF2"/><text x="62" y="348" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="364" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="354" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="376" x2="360" y2="376" stroke="#D5DBE3"/><circle cx="38" cy="400" r="14" fill="#E8ECF2"/><text x="62" y="398" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="414" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="404" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="426" x2="360" y2="426" stroke="#D5DBE3"/><circle cx="38" cy="450" r="14" fill="#E8ECF2"/><text x="62" y="448" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="464" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="454" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="476" x2="360" y2="476" stroke="#D5DBE3"/><circle cx="38" cy="500" r="14" fill="#E8ECF2"/><text x="62" y="498" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="514" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="504" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="526" x2="360" y2="526" stroke="#D5DBE3"/><circle cx="38" cy="550" r="14" fill="#E8ECF2"/><text x="62" y="548" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="564" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="554" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="576" x2="360" y2="576" stroke="#D5DBE3"/><circle cx="38" cy="600" r="14" fill="#E8ECF2"/><text x="62" y="598" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="614" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="604" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><line x1="30" y1="626" x2="360" y2="626" stroke="#D5DBE3"/><circle cx="38" cy="650" r="14" fill="#E8ECF2"/><text x="62" y="648" font-size="13" font-weight="600" fill="#1A202D" text-anchor="start">Bill name</text><text x="62" y="664" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start">Necessities · due</text><text x="360" y="654" font-size="13" font-weight="400" fill="#1A202D" text-anchor="end">− € …</text><rect x="16" y="694" width="358" height="48" rx="14" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/><text x="30" y="724" font-size="10" font-weight="700" fill="#5A6474" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ PAUSED AND ENDED</text><text x="360" y="724" font-size="11" font-weight="400" fill="#5A6474" text-anchor="end" font-family="IBM Plex Mono, Menlo, monospace">n</text><rect x="16" y="758" width="358" height="104" rx="14" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/><text x="30" y="782" font-size="10" font-weight="700" fill="#06656C" text-anchor="start" font-family="IBM Plex Mono, Menlo, monospace">✦ THE COACH</text><rect x="326" y="762" width="44" height="44" rx="22" fill="none"/><text x="348" y="789" font-size="18" font-weight="400" fill="#5A6474" text-anchor="middle">×</text><text x="30" y="806" font-size="14" font-weight="400" fill="#1A202D" text-anchor="start">Fixed costs take …% of your income.</text><text x="30" y="825" font-size="14" font-weight="400" fill="#1A202D" text-anchor="start">Your {jar} jar gets …%.</text><text x="30" y="850" font-size="13" font-weight="600" fill="#06656C" text-anchor="start">Open {biggest bill} →</text><text x="16" y="882" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start" font-style="italic">One line, only when a rule fires. Priority: over split &gt; business</text><text x="16" y="898" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start" font-style="italic">costs &gt; nothing. The quarterly review and "Is this enough?" go.</text><text x="16" y="914" font-size="11" font-weight="400" fill="#5A6474" text-anchor="start" font-style="italic">Tablet/desktop: same order, list full width; no right-hand tip column.</text></g><text x="615" y="1254" font-size="13" font-weight="700" fill="#1A202D" text-anchor="middle">AFTER: your bills, then at most one line</text><text x="0" y="1278" font-size="11" fill="#5A6474">1 = why-line · 2 = Subscription check (always on) · 3 = Is this enough? (always on with income) · 4 = Necessities under pressure · 5 = Business costs.</text><text x="0" y="1294" font-size="11" fill="#5A6474">On ≥ 640 px BEFORE puts 2 and 3 in a right-hand column beside the list, i.e. above the fold next to your bills.</text></svg>